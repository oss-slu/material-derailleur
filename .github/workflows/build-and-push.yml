on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: ./server
            dockerfile: ./server/Dockerfile
          - name: client
            context: ./client-app
            dockerfile: ./client-app/Dockerfile
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
      - name: Build and push
        id: build_push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build_push.outputs.digest }}
          format: spdx-json
          output-file: material-derailleur-${{ matrix.name }}-sbom.spdx.json
          upload-artifact: false
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.name }}
          path: material-derailleur-${{ matrix.name }}-sbom.spdx.json
          if-no-files-found: error
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build_push.outputs.digest }}
          push-to-registry: true
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build_push.outputs.digest }}
        run: |
          gh attestation verify "oci://$IMAGE_REF" --repo "$GITHUB_REPOSITORY" \
            --format json \
            --jq '.[].verificationResult.signature.certificate | "Verified: built by \(.buildSignerURI) from commit \(.sourceRepositoryDigest)"'

  update-manifests:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout k8s-manifests
        uses: actions/checkout@v7
        with:
          repository: oss-slu/k8s-manifests
          token: ${{ secrets.K8S_MANIFESTS_TOKEN }}
          path: k8s-manifests
      - name: Update image tags
        run: |
          SHA_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          sed -i "s|ghcr.io/oss-slu/material-derailleur/client:.*|ghcr.io/oss-slu/material-derailleur/client:${SHA_TAG}|" k8s-manifests/mdma/client.yaml
          sed -i "s|ghcr.io/oss-slu/material-derailleur/server:.*|ghcr.io/oss-slu/material-derailleur/server:${SHA_TAG}|" k8s-manifests/mdma/server.yaml
      - name: Commit and push
        run: |
          cd k8s-manifests
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mdma/client.yaml mdma/server.yaml
          git commit -m "chore: update mdma images to ${{ github.sha }}"
          git push
