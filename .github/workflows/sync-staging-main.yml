name: Sync Main to Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-main-to-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-branches:
    name: Reconcile Staging Branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Reconcile Main into Staging
        run: |
          echo "=== Fetching all remote branches ==="
          git fetch origin main:main

          # Check if staging branch exists remotely
          if git ls-remote --exit-code --heads origin staging > /dev/null 2>&1; then
            echo "Staging branch exists. Checking out staging..."
            git checkout staging
            git pull origin staging

            echo "Attempting to reconcile main into staging..."
            # Try fast-forward first, fall back to merge commit
            if git merge origin/main --ff-only; then
              echo "Successfully fast-forwarded staging to main."
            else
              echo "Fast-forward not possible; performing automated merge commit..."
              git merge origin/main -m "chore(gitops): auto-reconcile main into staging [skip ci]"
              echo "Merge completed cleanly."
            fi

            git push origin staging
            echo "Staging branch updated successfully."
          else
            echo "Staging branch does not exist yet. Creating staging from main..."
            git checkout -b staging main
            git push -u origin staging
            echo "Staging branch initialized and published."
          fi

      - name: Handle Reconciliation Conflicts
        if: failure()
        run: |
          echo "::error::Automated reconciliation failed due to merge conflicts between main and staging."
          echo "Please resolve conflicts manually: git checkout staging && git merge main"
