version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix(deps)"
      include: "scope"
    allow:
      - dependency-type: "all"
      - dependency-type: "direct"
      - dependency-type: "production"
    commit-message:
      prefix: "deps"
    # Auto Merge Rules
    automerge: true
    automerge-type: "pr"

  # Frontend (React)
  - package-ecosystem: "npm"
    directory: "/client-app"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix(deps)"
      include: "scope"
    allow:
      - dependency-type: "all"

  # Backend (Node)
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix(deps)"
      include: "scope"
    allow:
      - dependency-type: "all"
    ignore:
      # ts-jest only supports TypeScript < 7, so a major bump breaks npm install
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Optional: GitHub Actions workflow updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
